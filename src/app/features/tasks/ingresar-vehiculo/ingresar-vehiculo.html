<div *ngIf="!ticketGenerado; else mostrarTicket">

  <div class="card">
    <h2>Registrar Entrada de Vehículo</h2>

    <form [formGroup]="ingresoForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="placa">Placa del Vehículo</label>
        <div class="plate-input-wrapper">
          <input id="placa" type="text" formControlName="placa" ...>
        </div>
        </div>

      <div class="form-group">
        <label for="idTipoVehiculo">Tipo de Vehículo</label>
        <select id="idTipoVehiculo" formControlName="idTipoVehiculo" class="form-control">
          </select>
        </div>

      <button type="submit" class="btn btn-primary btn-full-width" ...>
        Generar Ticket de Entrada
      </button>
    </form>

    <div *ngIf="errorMensaje" class="response-message error">
      {{ errorMensaje }}
    </div>
  </div>
</div>


<ng-template #mostrarTicket>
  <div class="ticket-generado-container">
    <h3 class="exito-titulo">¡Vehículo Ingresado Correctamente!</h3>

    <app-ticket-recibo [ticket]="ticketGenerado"></app-ticket-recibo>

    <button (click)="registrarOtroVehiculo()" class="btn btn-secondary">
      Registrar Otro Vehículo
    </button>
  </div>
</ng-template>
