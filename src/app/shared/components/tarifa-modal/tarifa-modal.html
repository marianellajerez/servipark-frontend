<div class="modal-backdrop" (click)="onClose()"></div>

<div class="modal-content card">

  <div class="modal-header">
    <h3>Crear Nueva Tarifa</h3>
    <button class="btn-close" (click)="onClose()">×</button>
  </div>

  <div class="modal-body">
    <form [formGroup]="form" (ngSubmit)="onSave()">

      <div class="form-group">
        <label for="idTipoVehiculo">Tipo de Vehículo</label>
        <select id="idTipoVehiculo" formControlName="idTipoVehiculo" class="form-control">
          <option [ngValue]="null" disabled>Seleccione un tipo...</option>
          <option *ngFor="let tipo of (tiposVehiculo$ | async)" [value]="tipo.idTipoVehiculo">
            {{ tipo.nombre }}
          </option>
        </select>
        </div>

      <div class="form-group">
        <label for="valorPorMinuto">Valor por Minuto (Ej. 100)</label>
        <input 
          id="valorPorMinuto"
          type="number" 
          formControlName="valorPorMinuto"
          class="form-control"
          placeholder="100">
        </div>
    </form>
  </div>

  <div class="modal-footer">
    <div class="spacer"></div>

    <div class="actions-right">
      <button (click)="onClose()" class="btn btn-secondary">Cancelar</button>
      <button (click)="onSave()" [disabled]="form.invalid" class="btn btn-primary">
        Crear Tarifa
      </button>
    </div>
  </div>

</div>
