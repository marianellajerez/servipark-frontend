<div class="card">
  <h2>Consultar Ticket Activo por Placa</h2>

  <form [formGroup]="searchForm" (ngSubmit)="onSearch()">
    <div class="form-group">
      <label for="placa">Placa del Vehículo</label>
      <div class="plate-input-wrapper">
        <input 
          id="placa" 
          type="text" 
          formControlName="placa"
          placeholder="AAA123"
          maxlength="6"
          minlength="6">
      </div>
      </div>

    <button type="submit" class="btn btn-primary btn-full-width" [disabled]="searchForm.invalid">
      Buscar Ticket
    </button>
  </form>
</div>

<div *ngIf="errorMensaje" class="response-message error">
  {{ errorMensaje }}
</div>

<div *ngIf="ticketEncontrado" class="ticket-encontrado-container">
  <h3 class="exito-titulo">Ticket Activo Encontrado</h3>
  <app-ticket-recibo [ticket]="ticketEncontrado"></app-ticket-recibo>
</div>
