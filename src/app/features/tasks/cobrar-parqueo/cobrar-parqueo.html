<div class="card">
  <h2>Cobrar Parqueo y Registrar Salida</h2>

  <form [formGroup]="searchForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="placa">Placa del Vehículo</label>
      <div class="plate-input-wrapper">
        <input 
          id="placa" 
          type="text" 
          formControlName="placa"
          placeholder="AAA123"
          maxlength="6"
          minlength="6">
      </div>
    </div>

    <button type="submit" class="btn btn-primary btn-full-width" [disabled]="searchForm.invalid">
      Cobrar y Generar Recibo
    </button>
  </form>
</div>

<div *ngIf="errorMensaje" class="response-message error">
  {{ errorMensaje }}
</div>
