<header class="header-shell">

  <div class="spacer"></div>

  <div class="user-menu">

    <button class="user-menu-button" (click)="toggleMenu()">
      <span>{{ userName }}</span>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.25 4.25a.75.75 0 01-1.06 0L5.21 8.27a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
      </svg>
    </button>

    <div class="user-dropdown card" *ngIf="isMenuOpen">
      <div class="user-info">
        <div class="user-name">{{ userName }}</div>
        <div class="user-email">{{ userEmail }}</div>
        <div class="user-role">{{ userRole }}</div>
      </div>

      <hr class="divider">

      <button class="btn btn-secondary btn-full-width" (click)="onLogout()">
        Cerrar Sesión
      </button>
    </div>

  </div>
</header>
