<div class="card">
  
  <div class="card-header-split">
    <div class="header-title">
      <h2>Gestión de Tipos de Vehículo</h2>
      <p>Crea, edita y desactiva los tipos de vehículo del parqueadero.</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" (click)="openCreateModal()">
        Crear Tipo Vehículo
      </button>
    </div>
  </div>

  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          
          <th class="text-right">Estado</th>
          
          <th class="text-right">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="!(tiposVehiculo$ | async)">
          <td colspan="3">Cargando tipos de vehículo...</td>
        </tr>
        
        <tr *ngFor="let tipo of (tiposVehiculo$ | async)">
          <td>{{ tipo.nombre }}</td>
          
          <td class="text-right">
            <span class="badge" [class.badge-active]="tipo.activo" [class.badge-inactive]="!tipo.activo">
              {{ tipo.activo ? 'Activo' : 'Inactivo' }}
            </span>
          </td>
          
          <td class="text-right">
            <button class="btn btn-secondary" (click)="openEditModal(tipo)">
              Gestionar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<app-tipo-vehiculo-modal 
  *ngIf="isModalOpen"
  [data]="selectedTipo"
  (close)="closeModal()"
  (save)="handleSave($event)"
  (deactivate)="handleDeactivate($event)">
</app-tipo-vehiculo-modal>
