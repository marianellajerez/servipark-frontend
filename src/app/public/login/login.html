<div class="login-container">

    <h2>ServiPark</h2>
    <h3>Iniciar Sesión</h3>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <div class="form-group">
            <label for="email">Usuario (Email):</label>
            <input id="email" type="email" formControlName="correo" placeholder="ejemplo@correo.com">

            <div *ngIf="loginForm.get('correo')?.touched && loginForm.get('correo')?.invalid" class="error-validation">
                Se requiere un email válido.
            </div>
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input id="password" type="password" formControlName="contrasena">
        </div>

        <div *ngIf="errorMessage" class="error-message">
            {{ errorMessage }}
        </div>

        <button type="submit" [disabled]="loginForm.invalid">
            Ingresar
        </button>

    </form>
</div>
